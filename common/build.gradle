architectury {
    common('neoforge', 'fabric')
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/resources'
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
    annotationProcessor "org.spongepowered:mixin:0.8.5"
    modCompileOnly("io.wispforest:accessories-common:${project.accessories_version}-mojmap")
    modImplementation "maven.modrinth:jade:${project.jade_version}"
    modCompileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    modCompileOnly "maven.modrinth:trinkets:${project.trinkets_version}"
    modApi("dev.ryanhcode.sable:sable-common-${project.minecraft_version}:${project.sable_version}")
}