plugins {
    id 'java-library'
    id 'maven-publish'
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven { url = "https://cursemaven.com" }
        maven { url = "https://maven.createmod.net" }
        maven { url = "https://maven.ithundxr.dev/snapshots" }
        maven { url = "https://maven.shedaniel.me/" }
        maven {
            url "https://maven.squiddev.cc"
            content { includeGroup("cc.tweaked") }
        }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        maven { url = "https://maven.parchmentmc.org" }
        mavenLocal()
        maven { url = "https://maven.theillusivec4.top/" }
        maven { url = 'https://maven.blamejared.com' }
        maven {
            url = "https://maven.ryanhcode.dev/releases"
            name = "RyanHCode Maven"
        }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url 'https://maven.wispforest.io/releases' }
        maven { url 'https://maven.su5ed.dev/releases' }
        maven { url 'https://maven.fabricmc.net' }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.isxander.dev/releases" }
        maven {
            name = "Kotlin for Forge"
            url = "https://thedarkcolour.github.io/KotlinForForge/"
        }
        mavenCentral() // toml4j
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${project.parchment_minecraft_version}:${project.parchment_mappings_version}@zip")
        }
    }

    java {
        withSourcesJar()
    }
}

publishMods {
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE
    displayName = "Entombed ${project.version}"

    modrinth("modrinthNeoForge") {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "b3lWYZUQ"
        minecraftVersions.add("1.21.1")
        file = project(":neoforge").jar.archiveFile
        modLoaders.add("neoforge")
        requires("yacl")
    }

    modrinth("modrinthFabric") {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "b3lWYZUQ"
        minecraftVersions.add("1.21.1")
        file = project(":fabric").jar.archiveFile
        modLoaders.add("fabric")
        requires("fabric-api", "yacl")
    }

    curseforge("curseforgeFabric") {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1559359"
        minecraftVersions.add("1.21.1")
        client = true
        server = true
        file = project(":fabric").jar.archiveFile
        modLoaders.add("fabric")
        requires("fabric-api", "yacl")
    }

    curseforge("curseforgeNeoForge") {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1559359"
        minecraftVersions.add("1.21.1")
        client = true
        server = true
        file = project(":neoforge").jar.archiveFile
        modLoaders.add("neoforge")
        requires("yacl")
    }

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "AdoLovesChicken/Entombed"
        commitish = "dev"
        tagName = "${project.version}"
        file = project(":fabric").jar.archiveFile
        additionalFiles.from(
                project(":neoforge").jar.archiveFile,
                project(":fabric").sourcesJar.archiveFile,
                project(":neoforge").sourcesJar.archiveFile
        )
    }
}